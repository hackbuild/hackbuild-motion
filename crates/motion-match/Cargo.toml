[package]
name = "hackbuild-motion-match"
version = "0.1.0"
description = "Classic motion matching over a clip database with normalized features, bounding box search and inertialized transitions"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "motion_match"
crate-type = ["cdylib", "rlib"]

[features]
default = ["std"]
std = ["organic/std", "gait/std"]
wasm = ["std", "dep:wasm-bindgen"]

[dependencies]
libm = "0.2.16"
organic = { package = "hackbuild-organic", path = "../organic", default-features = false }
gait = { package = "hackbuild-gait", path = "../gait", default-features = false }
wasm-bindgen = { version = "=0.2.129", optional = true }
