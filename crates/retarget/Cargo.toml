[package]
name = "hackbuild-retarget"
version = "0.1.0"
description = "Humanoid motion interchange format, clip retargeting between any rigs, BVH and VMD readers, motion analysis that tags clips"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "retarget"
crate-type = ["cdylib", "rlib"]

[features]
default = ["std"]
std = ["organic/std", "rig/std"]
wasm = ["std", "dep:wasm-bindgen"]

[dependencies]
libm = "0.2.16"
organic = { package = "hackbuild-organic", path = "../organic", default-features = false }
rig = { package = "hackbuild-rig", path = "../rig", default-features = false }
wasm-bindgen = { version = "=0.2.129", optional = true }
