[package]
name = "hackbuild-bake"
version = "0.1.0"
description = "GLB optimize with texture hooks, clip bake into compact packs with error and seam reports, and an asset lock file with licence and SHA-256"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "bake"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "hackbuild-bake"
path = "src/bin/hackbuild-bake.rs"

[features]
default = []
wasm = ["dep:wasm-bindgen"]

[dependencies]
organic = { package = "hackbuild-organic", path = "../organic" }
meshoptimizer = { package = "meshopt-pure", version = "=1.3.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
wasm-bindgen = { version = "=0.2.129", optional = true }
