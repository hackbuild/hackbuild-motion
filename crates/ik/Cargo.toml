[package]
name = "hackbuild-ik"
version = "0.1.0"
description = "Two bone analytic IK with pole, FABRIK, CCD, clamped look at, hand frame and finger curl, contact locking"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "ik"
crate-type = ["cdylib", "rlib"]

[features]
default = ["std"]
std = ["organic/std"]
wasm = ["std", "dep:wasm-bindgen"]

[dependencies]
libm = "0.2.16"
organic = { package = "hackbuild-organic", path = "../organic", default-features = false }
wasm-bindgen = { version = "=0.2.129", optional = true }
