name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  # the live site deploys only from a commit whose ci passes
  ci:
    uses: ./.github/workflows/ci.yml
  build:
    needs: ci
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm install -g npm@11.21.0
      # hackbuild-ui is vendored pinned by commit (its tools/pin-ui.mjs writes the pin); the tarball,
      # its sha-256, SHA256SUMS, package.json and the lockfile must all match tools/vendor/hackbuild-ui.pin
      - run: node tools/vendor/pin-ui.mjs --check
      - run: rustup toolchain install && rustc --version
      - run: cargo install wasm-pack --version 0.13.1 --locked
      - run: npm ci
      - run: npm run build
      - run: node tools/build-pages.mjs
        env:
          SUITE_URL: https://hackbuild.github.io/hackbuild-suite/
      # getting started, concepts, package READMEs, the API reference, llms.txt and llms-full.txt
      - run: npm ci --prefix tools/typedoc
      - run: node tools/build-docs.mjs
      # weights and model files never ship; the pages fetch them from upstream or take a dropped file
      - run: "! find _site -type f | grep -Ei '\\.(glb|gltf|vrm|fbx|bvh|wav|bin|onnx|safetensors|gguf)$'"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
